<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ANIKESH  | v2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --primary-color: #00ffcc;
      --secondary-color: #00ccff;
      --accent-color: #ff4500;
      --premium-color: #ffd700;
      --bg-gradient: linear-gradient(135deg, #0a0a0f, #001f0a);
      --text-color: #e0e0e0;
      --dark-bg: rgba(10, 25, 20, 0.5);
      --border-color: #00ff99;
      --font-main: 'Poppins', sans-serif;
      --font-tech: 'Orbitron', sans-serif;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-main);
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-color);
      position: relative;
      overflow: hidden;
    }

    .scanline::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0) 0,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 255, 153, 0.05) 3px,
        rgba(0, 255, 153, 0.05) 4px
      );
      pointer-events: none;
      animation: scan 10s linear infinite;
      z-index: -1;
    }
    
    @keyframes scan {
      from { background-position-y: 0; }
      to { background-position-y: -100px; }
    }

    .screen {
      display: flex;
      flex-direction: column;
      width: 370px;
      padding: 25px 30px;
      background: rgba(20, 20, 30, 0.2);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0, 255, 153, 0.2);
      text-align: center;
      position: absolute;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
    }

    .screen.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    h1 {
      margin-bottom: 25px;
      font-family: var(--font-tech);
      font-size: 26px;
      letter-spacing: 3px;
      color: var(--primary-color);
      text-shadow: 0 0 5px var(--primary-color), 0 0 10px var(--primary-color);
      position: relative;
    }

    .glitch {
      position: relative;
    }
    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      clip: rect(0, 900px, 0, 0);
    }
    .glitch::before {
      left: 2px;
      text-shadow: -2px 0 #ff00c1;
      animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
    }
    .glitch::after {
      left: -2px;
      text-shadow: -2px 0 var(--secondary-color);
      animation: glitch-anim-2 2s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 { 0% { clip: rect(29px, 9999px, 31px, 0); } 20% { clip: rect(79px, 9999px, 81px, 0); } 40% { clip: rect(49px, 9999px, 51px, 0); } 60% { clip: rect(19px, 9999px, 21px, 0); } 80% { clip: rect(89px, 9999px, 91px, 0); } 100% { clip: rect(39px, 9999px, 41px, 0); } }
    @keyframes glitch-anim-2 { 0% { clip: rect(35px, 9999px, 92px, 0); } 20% { clip: rect(5px, 9999px, 58px, 0); } 40% { clip: rect(48px, 9999px, 16px, 0); } 60% { clip: rect(81px, 9999px, 73px, 0); } 80% { clip: rect(21px, 9999px, 84px, 0); } 100% { clip: rect(62px, 9999px, 37px, 0); } }

    .input-group {
      position: relative;
      margin: 15px 0;
    }
    .input-group i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary-color);
      opacity: 0.7;
    }
    select, input[type="password"] {
      width: 100%;
      padding: 12px 12px 12px 45px;
      background: var(--dark-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      font-size: 1em;
      transition: box-shadow 0.3s ease, background 0.3s ease;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }
    select {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%2300ffcc' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 1rem center;
        background-size: 1em;
    }
    select:focus, input[type="password"]:focus {
      outline: none;
      box-shadow: 0 0 12px var(--primary-color);
      background: rgba(10, 25, 20, 0.8);
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 15px 0 5px 0;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      color: #000;
      font-weight: 600;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: pulse-glow 2.5s infinite alternate;
    }
    button i { margin-right: 10px; }
    @keyframes pulse-glow {
      from { box-shadow: 0 0 8px var(--primary-color); }
      to { box-shadow: 0 0 20px var(--secondary-color); }
    }
    button:hover:not(:disabled) {
      transform: scale(1.03);
      box-shadow: 0 0 25px var(--primary-color);
    }
    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
      animation: none;
      box-shadow: none;
    }

    /* Game Screen Elements */
    .premium-display {
      background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,69,0,0.1));
      border: 1px solid var(--premium-color);
      padding: 20px;
      border-radius: 10px;
      margin: 15px 0;
    }
    .period-number {
      font-family: var(--font-tech);
      font-size: 1.2em;
      color: var(--premium-color);
      letter-spacing: 2px;
      margin: 0;
      opacity: 0.8;
    }
    .timer {
      font-family: var(--font-tech);
      font-size: 3em;
      color: var(--text-color);
      margin: 5px 0 0 0;
      text-shadow: 0 0 8px var(--text-color);
    }
    .result-box {
      margin-top: 15px;
      padding: 20px;
      background: var(--dark-bg);
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      min-height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s ease;
    }
    #resultText {
      font-family: var(--font-tech);
      font-size: 1.8em;
      font-weight: 700;
      letter-spacing: 2px;
      transition: opacity 0.5s ease;
      opacity: 0.5;
    }

    .back-button {
      position: absolute;
      top: 25px;
      left: 25px;
      width: auto;
      padding: 5px 12px;
      margin: 0;
      background: transparent;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      animation: none;
      box-shadow: none;
    }
    .back-button:hover {
        background: var(--primary-color);
        color: #000;
    }

    /* Notification System */
    #notification-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .notification {
      padding: 15px 20px;
      border-radius: 8px;
      color: #000;
      font-weight: 600;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateX(120%);
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }
    .notification.show {
      opacity: 1;
      transform: translateX(0);
    }
    .notification.error { background: linear-gradient(90deg, #ff416c, #ff4b2b); }
    .notification.success { background: linear-gradient(90deg, var(--primary-color), var(--secondary-color)); }
    .notification.info { background: linear-gradient(90deg, var(--premium-color), var(--accent-color)); }
    
    /* Corner Decorations */
    .corners {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    .corner {
      position: absolute; width: 20px; height: 20px;
      border: 2px solid var(--primary-color);
      opacity: 0.5;
    }
    .corner.top-left { top: -1px; left: -1px; border-right: none; border-bottom: none; border-top-left-radius: 15px; }
    .corner.top-right { top: -1px; right: -1px; border-left: none; border-bottom: none; border-top-right-radius: 15px;}
    .corner.bottom-left { bottom: -1px; left: -1px; border-right: none; border-top: none; border-bottom-left-radius: 15px;}
    .corner.bottom-right { bottom: -1px; right: -1px; border-left: none; border-top: none; border-bottom-right-radius: 15px;}

  </style>
</head>
<body>
  <div class="scanline"></div>

  <!-- Main Container -->
  <div class="screen active" id="mainContainer">
    <div class="corners">
      <div class="corner top-left"></div><div class="corner top-right"></div>
      <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
    </div>
    <h1 class="glitch" data-text="𝗖𝗬𝗕𝗘𝗥 𝗠𝗢𝗗𝗘">ANIKESH</h1>
    
    <div class="input-group">
      <i class="fas fa-server"></i>
      <select id="serverSpinner">
        <option disabled selected>SELECT SERVER</option>
        <option>91 CLUB</option><option>TIRANGA</option><option>BIG MUMBAI</option>
        <option>BIG DADDY</option><option>GOA GAME</option><option>OK WIN</option>
        <option>55 CLUB</option><option>BDG WIN</option><option>DIUWIN</option>
        <option>101GAME</option><option>TP PLAY</option><option>DAMAN</option>
        <option>RAJA LUCK</option><option>KWG GAME</option><option>51GAME</option>
      </select>
    </div>

    <div class="input-group">
      <i class="fas fa-gamepad"></i>
      <select id="playSpinner">
        <option disabled selected>SILENTXKILLER</option>
        <option value="big_small">BIG / SMALL</option>
        <option value="red_green">RED / GREEN</option>
      </select>
    </div>

    <div class="input-group">
      <i class="fas fa-key"></i>
      <input type="password" id="paidKey" placeholder="ENTER PAID KEY" />
    </div>

    <button id="validateButton">
      <i class="fas fa-shield-halved"></i> VALIDATE
    </button>
  </div>

  <!-- Game Screen (Unified) -->
  <div class="screen" id="gameScreen">
    <div class="corners">
        <div class="corner top-left"></div><div class="corner top-right"></div>
        <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
    </div>
    <button id="backButton" class="back-button" title="Go Back"><i class="fas fa-arrow-left"></i></button>
    <h1 class="glitch" data-text="𝗖𝗬𝗕𝗘𝗥 𝗠𝗢𝗗𝗘">SILENTXKILLER</h1>
    
    <div class="premium-display">
      <p class="period-number" id="periodNumber">Loading...</p>
      <p class="timer" id="timer">00:00</p>
    </div>
    <button id="checkResultButton">
      <i class="fas fa-crosshairs"></i> PREDICT
    </button>
    <div class="result-box">
      <p id="resultText">Awaiting prediction...</p>
    </div>
  </div>

  <!-- Notification Container -->
  <div id="notification-container"></div>

  <!-- JavaScript Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- State Management ---
        const state = {
            playType: null,
            lastCheckedPeriod: null,
            currentPeriod: null,
            timerInterval: null,
            correctKey: 'BADSHAH_ON_TOP'
        };

        // --- DOM Elements ---
        const screens = {
            main: document.getElementById('mainContainer'),
            game: document.getElementById('gameScreen')
        };
        const inputs = {
            server: document.getElementById('serverSpinner'),
            playType: document.getElementById('playSpinner'),
            paidKey: document.getElementById('paidKey')
        };
        const buttons = {
            validate: document.getElementById('validateButton'),
            checkResult: document.getElementById('checkResultButton'),
            back: document.getElementById('backButton')
        };
        const display = {
            periodNumber: document.getElementById('periodNumber'),
            timer: document.getElementById('timer'),
            resultText: document.getElementById('resultText'),
            notificationContainer: document.getElementById('notification-container')
        };

        // --- Core Functions ---

        function showScreen(screenName) {
            Object.values(screens).forEach(screen => screen.classList.remove('active'));
            screens[screenName].classList.add('active');
        }

        function showNotification(message, type = 'error', duration = 3000) {
            const notif = document.createElement('div');
            notif.className = `notification ${type}`;
            notif.textContent = message;
            display.notificationContainer.appendChild(notif);
            setTimeout(() => notif.classList.add('show'), 10);
            setTimeout(() => {
                notif.classList.remove('show');
                notif.addEventListener('transitionend', () => notif.remove());
            }, duration);
        }

        function updateTimer() {
            const now = new Date();
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 5, 30, 0);
            if (now < startOfDay) {
                startOfDay.setDate(startOfDay.getDate() - 1);
            }
            
            const elapsedSeconds = Math.floor((now - startOfDay) / 1000);
            const periodDuration = 30;
            const periodsPassed = Math.floor(elapsedSeconds / periodDuration);
            const upcomingPeriodIndex = periodsPassed + 1;
            const dateString = now.toISOString().split('T')[0].replace(/-/g, '');
            
            const periodNumber = "100005" + String(upcomingPeriodIndex).padStart(4, '0');
            const remainingSeconds = periodDuration - (elapsedSeconds % periodDuration);

            display.periodNumber.textContent = `PERIOD: ${dateString}${periodNumber}`;
            display.timer.textContent = `00:${String(remainingSeconds).padStart(2, '0')}`;

            if (state.currentPeriod !== periodNumber) {
                state.currentPeriod = periodNumber;
                onNewPeriod();
            }
        }
        
        function onNewPeriod() {
            buttons.checkResult.disabled = false;
            buttons.checkResult.innerHTML = '<i class="fas fa-crosshairs"></i> PREDICT';
            display.resultText.textContent = 'Awaiting prediction...';
            display.resultText.style.opacity = 0.5;
        }

        function validateKey() {
            const key = inputs.paidKey.value;
            const selectedPlayType = inputs.playType.value;
            
            if (!selectedPlayType || inputs.playType.selectedIndex === 0) {
                showNotification('Please select a valid play type.', 'info');
                return;
            }

            if (key === state.correctKey) {
                showNotification('Validation Successful! Accessing panel...', 'success');
                state.playType = selectedPlayType;
                
                setTimeout(() => {
                    initGame();
                    showScreen('game');
                }, 1000);

            } else {
                showNotification('Invalid Key. Contact TG: SILENTXKILLER', 'error');
                inputs.paidKey.value = '';
            }
        }

        function checkResult() {
            if (state.lastCheckedPeriod === state.currentPeriod) {
                showNotification('Prediction made. Wait for the next period.', 'info');
                return;
            }

            state.lastCheckedPeriod = state.currentPeriod;
            buttons.checkResult.disabled = true;
            buttons.checkResult.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ANALYZING';
            
            // Simulate analysis delay
            setTimeout(() => {
                let result = '';
                if (state.playType === 'big_small') {
                    result = Math.random() > 0.5 ? "BIG" : "SMALL";
                } else { // red_green
                    result = Math.random() > 0.5 ? "RED 🟥" : "GREEN 🟩";
                }
                
                display.resultText.textContent = result;
                display.resultText.style.opacity = 1;
                buttons.checkResult.innerHTML = '<i class="fas fa-check"></i> PREDICTED';
            }, 1500);
        }

        function initGame() {
            state.lastCheckedPeriod = null;
            state.timerInterval = setInterval(updateTimer, 1000);
            updateTimer(); 
        }
        
        function goBack() {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
            inputs.paidKey.value = '';
            showScreen('main');
        }

        // --- Event Listeners ---
        buttons.validate.addEventListener('click', validateKey);
        buttons.checkResult.addEventListener('click', checkResult);
        buttons.back.addEventListener('click', goBack);
        
        inputs.paidKey.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                buttons.validate.click();
            }
        });
    });
  </script>
</body>
</html>
